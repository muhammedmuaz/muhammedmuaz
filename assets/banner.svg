<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="1200" height="300" role="img" aria-label="Maaz Zindani, Remote Senior Software Engineer">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1d3557"/>
      <stop offset="1" stop-color="#14263f"/>
    </linearGradient>
    <style>
      .name{font:700 64px -apple-system,'Segoe UI',Helvetica,Arial,sans-serif;fill:#f1faee;letter-spacing:-1px}
      .role{font:600 26px -apple-system,'Segoe UI',Helvetica,Arial,sans-serif;fill:#a8dadc}
      .line{font:400 19px -apple-system,'Segoe UI',Helvetica,Arial,sans-serif;fill:#f1faee;opacity:.85}
      .mono{font:500 15px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;fill:#a8dadc}
      .rise{animation:rise 1.2s ease-out both}
      .d2{animation-delay:.25s}.d3{animation-delay:.5s}
      .bar{transform-origin:0 0;animation:grow 1.4s ease-out both}
      .pulse{animation:pulse 3s ease-in-out infinite}
      @keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
      @keyframes grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}
      @keyframes pulse{0%,100%{opacity:.35}50%{opacity:.9}}
    </style>
  </defs>
  <rect width="1200" height="300" fill="url(#bg)"/>
  <circle cx="1060" cy="60" r="190" fill="#457b9d" opacity=".22"/>
  <circle cx="1130" cy="270" r="120" fill="#a8dadc" opacity=".12"/>
  <g class="pulse" fill="none" stroke="#a8dadc" stroke-width="2" opacity=".5">
    <rect x="930" y="90" width="150" height="120" rx="10"/>
    <path d="M930 120h150M960 105h.01M980 105h.01M1000 105h.01"/>
    <path d="M960 150l20 15-20 15M995 182h40"/>
  </g>
  <rect class="bar" x="70" y="62" width="64" height="6" rx="3" fill="#e63946"/>
  <text class="name rise" x="68" y="140">Maaz Zindani</text>
  <text class="role rise d2" x="70" y="185">Remote Senior Software Engineer</text>
  <text class="line rise d3" x="70" y="226">Builds and runs mobile apps, web platforms and back ends for teams worldwide.</text>
  <text class="mono" x="70" y="262">maazzindani.com</text>
</svg>
